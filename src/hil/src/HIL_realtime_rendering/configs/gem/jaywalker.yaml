# A pedestrian crosses the y = -13 route 40 m east of the origin, from north to south.
# Triggered when the car comes within `trigger_distance` of the pedestrian, then walks along its own
# heading: rot y = 0 walks north, 180 south, 90 west, 270 east (3 renderer frames per step, 0.05 m per
# unit step => speed depends on the rendered frame rate).
# Renderer frame: x = -East, y = Up, z = North (metres), origin = hil/origin.py ORIGIN_LAT/LON.
# An object at local position (E east, N north) uses `pos: [-E, 0.0, N]` in object2scenario.
# The ground plane is 1.8 m below the camera height at the origin (world.scenario2world, y = -1.8).
mode: production
target_frame_rate: 100
shadow_constant: 1
device: cuda
display: pygame2
use_depth_occlusion: False
window_size: [640, 360]


light_config:
  direction: [0.0, 1.0, -0.2] # it will be normalized during postprocessing
  color: [0.6, 0.8, 1.0] # rgb
  intensity_config:
    light: 0.0
    ambient: 1.0
    shadow: 0.02
  shadow_poisson_sampling_denominator: 700.0
  gamma_correction: 1.0

camera_config:
  # vertical field of view in degrees = 2*atan(H / (2*fy)). ZED2 HD720 (fy ~ 527.6) -> ~68.6;
  # 72 is the value used by the original experiments.
  # TODO(USER): set from your camera_info (K[4] = fy, height = 720)
  fov: 72.0
  near: 0.1
  far: 100.0

scenario_configs:
  world:
    scenario2world:
      pos:   [0.0, -1.8, 0.0]
      rot:   [0.0, 0.0, 0.0]
      scale: [1.0, 1.0, 1.0]

  intersection:
    is_activated: False

  jaywalking:
    is_activated: True
    trigger_distance: 15.0
    scenario2world:
      pos:   [0.0, -1.8, 0.0]
      rot:   [0.0, 0.0, 0.0]
      scale: [1.0, 1.0, 1.0]
    actor_configs:
      actor_0:   # man_walking starting at ENU east=40, north=-8 (5 m north of the route), walking south
        animation_type: man_walking
        object2scenario:
          pos:   [-40.0, 0.0, -8.0]
          rot:   [0.0, 180.0, 0.0]
          scale: [1.0, 1.0, 1.0]

  static_objects:
    is_activated: False
